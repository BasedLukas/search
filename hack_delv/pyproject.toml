[project]
name = "search-api-lambda"
version = "0.1.0"
description = "AWS Lambda function for search API with external API integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests==2.31.0",
    "python-json-logger==2.0.7",
    "beautifulsoup4==4.12.2",
    "python-dotenv==1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/"]