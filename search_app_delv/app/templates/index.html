<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
  <title>getdelv demo</title>
  <style>
    body {
      background-color: #f7f3e9;
      font-family: monospace;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 20px 20px 20px; /* Added more top padding */
    }
    .header {
      margin-bottom: 40px; /* Added more margin to the bottom of header */
    }
    .main-title {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    .tagline {
      font-size: 1.2rem;
      margin-top: 0;
    }
    .search-container {
      margin: 30px 0;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #333;
      border-radius: 4px;
      font-size: 1rem;
      font-family: monospace;
    }
    .btn {
      background-color: #e5edd3;
      border: 2px solid #333;
      padding: 10px 20px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 1rem;
      cursor: pointer;
      display: inline-block;
      margin: 10px 0;
      text-decoration: none;
      color: #333;
    }
    .search-for {
      margin-top: 40px;
    }
    .search-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    .search-options a:last-child {
      grid-column: 1;
    }
    .back-button {
      margin-top: 30px;
    }
    /* Adding responsive design */
    @media (max-width: 768px) {
      .search-options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header section with title -->
    <div class="header">
      <h1 class="main-title">getdelv Demo</h1>
      <p class="tagline">Better Code Through Better Context</p>
    </div>
    
    <!-- Search form -->
    <form class="search-container" action="/search" method="get">
      <input type="text" name="query" placeholder="Enter your search..." autofocus required>
      <button type="submit" class="btn">Search</button>
    </form>
    
    <!-- Search suggestions section -->
    <div class="search-for">
      <h2>Search for:</h2>
      <div class="search-options">
        <a class="btn" href="/search?query=how to use numpy version 1.19 ravel()">
          how to use numpy version 1.19 ravel()
        </a>
        <a class="btn" href="/search?query=postgersql 9.4 vs 10 SQL LIKE operator">
          postgersql 9.4 vs 10 SQL LIKE operator
        </a>
        <a class="btn" href="/search?query=wordpress function to test for mobile">
          wordpress function to test for mobile
        </a>
      </div>
    </div>
  </div>
</body>
</html>
