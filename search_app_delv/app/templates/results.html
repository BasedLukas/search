<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='results.css') }}">
  <title>Search Results - getdelv demo</title>
  <style>
    body {
      background-color: #f7f3e9;
      font-family: monospace;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 800px;  /* Reduced from 1000px for better readability */
      margin: 0 auto;
      padding: 60px 40px; /* Increased horizontal padding */
    }
    .search-container {
      margin: 30px 0;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #333;
      border-radius: 4px;
      font-size: 1rem;
      font-family: monospace;
    }
    .btn {
      background-color: #e5edd3;
      border: 2px solid #333;
      padding: 10px 20px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 1rem;
      cursor: pointer;
      display: inline-block;
      margin: 10px 0;
      text-decoration: none;
      color: #333;
    }
    .back-button {
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Search form -->
    <form class="search-container" action="/search" method="get">
      <input type="text" name="query" value="{{ query }}" required>
      <button type="submit" class="btn">Search</button>
    </form>
    
    <!-- Results will be displayed here -->
    <div class="results-container">
      {% if my_results %}
        <div class="results-grid" style="display: block;">  <!-- Changed to block display -->
          {% for result in my_results %}
            <div class="result-item" onclick="toggleExpand(this)" style="margin-bottom: 20px;">  <!-- Added margin -->
              <h3>{{ result.title }}</h3>
              <div class="result-html">
                {{ result.html|safe }}
              </div>
              {% if result.source %}
                <p class="result-source">Source: {{ result.source }}</p>
              {% endif %}
            </div>
          {% endfor %}
        </div>
      {% else %}
        <p>No results found for "{{ query }}"</p>
      {% endif %}
    </div>
    
    
    <!-- Back button -->
    <div class="back-button">
      <a href="/" class="btn">Back to Search</a>
    </div>
  </div>

  <script>
    function toggleExpand(element) {
      const htmlContent = element.querySelector('.result-html');
      htmlContent.classList.toggle('expanded');
    }
  </script>
</body>
</html>
