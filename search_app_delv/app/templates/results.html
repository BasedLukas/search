<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
  <title>Search Results - getdelv demo</title>
  <style>
    body {
      background-color: #f7f3e9;
      font-family: monospace;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 20px 20px 20px; /* Added more top padding */
    }
    .search-container {
      margin: 30px 0;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #333;
      border-radius: 4px;
      font-size: 1rem;
      font-family: monospace;
    }
    .btn {
      background-color: #e5edd3;
      border: 2px solid #333;
      padding: 10px 20px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 1rem;
      cursor: pointer;
      display: inline-block;
      margin: 10px 0;
      text-decoration: none;
      color: #333;
    }
    .back-button {
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Search form -->
    <form class="search-container" action="/search" method="get">
      <input type="text" name="query" value="{{ query }}" required>
      <button type="submit" class="btn">Search</button>
    </form>
    
<!-- Results will be displayed here -->
<div class="results">
  {% if my_results %}
    {% for result in my_results %}
      <div class="result-item">
        <h3>{{ result.title }}</h3>
        <div class="result-content">
          {{ result.html|safe }}
        </div>
        {% if result.source %}
          <p class="result-source">Source: {{ result.source }}</p>
        {% endif %}
      </div>
    {% endfor %}
  {% else %}
    <p>No results found for "{{ query }}"</p>
  {% endif %}

</div>
    
    <!-- Back button -->
    <div class="back-button">
      <a href="/" class="btn">Back to Search</a>
    </div>
  </div>
</body>
</html>
